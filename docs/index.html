<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5c4a">
<meta name="description" content="FamilyFlow — family tasks, rewards and planning.">
<title>FamilyFlow</title>
<style>
:root{--bg:#f4f7f4;--card:#fff;--soft:#e8eee9;--text:#17221e;--muted:#66756e;--line:#dce4de;--brand:#1f5c4a;--brand2:#dcebe4;--danger:#b43a30;--warn:#a56b08;--shadow:0 8px 28px #17221e12;--r:18px}
[data-theme=dark]{--bg:#0e1613;--card:#16211d;--soft:#1e2c27;--text:#e7eee9;--muted:#9aaba3;--line:#2b3a34;--brand:#65c7a2;--brand2:#193b30;--shadow:0 8px 28px #0008}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}.app{min-height:100vh}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--card);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:6px 10px 22px}.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--brand);color:#fff;font-style:normal}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;padding:12px;border-radius:12px;text-align:left;font-weight:650;color:var(--muted)}.nav button.active,.nav button:hover{background:var(--brand2);color:var(--brand)}.side-bottom{position:absolute;bottom:20px;left:14px;right:14px}.main{width:min(1100px,100%);padding:24px 28px 70px;margin:auto}.mobile-nav{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title h1{font-size:30px;margin:0}.title p{margin:5px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);padding:10px 15px;border-radius:12px;font-weight:700}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.ghost{background:transparent}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}.stat b{display:block;font-size:27px}.stat span{color:var(--muted)}.hero{background:var(--brand);color:#fff;border-radius:24px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-bottom:15px}.hero h2{font-size:32px;margin:4px 0}.hero p{color:#d9eee5}.progress{height:10px;background:#ffffff25;border-radius:99px;overflow:hidden;margin-top:15px}.progress i{display:block;height:100%;background:#fff;border-radius:99px}.section{margin-top:24px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h2{font-size:19px;margin:0}.tasks{display:grid;gap:9px}.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:13px;border:1px solid var(--line);border-left:5px solid var(--c,var(--line));border-radius:15px;background:var(--card)}.task.done{opacity:.65}.task.done .task-name{text-decoration:line-through}.check{width:27px;height:27px;border-radius:50%;border:2px solid var(--muted);background:transparent;color:transparent}.check.on{background:var(--brand);border-color:var(--brand);color:#fff}.task-name{font-weight:750}.desc{color:var(--muted);margin-top:3px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{font-size:11px;font-weight:750;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}.high{background:#f8dfdc;color:#a52e26}.medium{background:#f8ecd1;color:#8a5c08}.low{background:#e2e8f3;color:#405c8e}.over{background:#f8dfdc;color:#a52e26}.task-actions{display:flex;gap:4px}.icon{border:0;background:transparent;padding:7px;border-radius:9px}.icon:hover{background:var(--soft)}.members{grid-template-columns:repeat(3,1fr)}.member{border:1px solid var(--line);border-top:5px solid var(--c);padding:16px;border-radius:15px;background:var(--card)}.member-head{display:flex;gap:11px;align-items:center}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:800}.member h3{margin:0}.member small{color:var(--muted)}.member-nums{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}.member-nums span{background:var(--soft);padding:8px;border-radius:10px}.member-nums b{font-size:19px}.member-nums small{display:block}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;margin-bottom:13px}.input,.select,.textarea{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--card);border-radius:11px}.textarea{min-height:90px;resize:vertical}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:100px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}.day strong{display:block}.day.today{outline:2px solid var(--brand)}.mini{font-size:11px;margin-top:6px;padding:5px 6px;border-radius:7px;background:var(--brand2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.feed{display:grid;gap:9px}.feed-item{display:flex;gap:10px;padding:11px;border-bottom:1px solid var(--line)}.reward{display:flex;align-items:center;justify-content:space-between;gap:12px}.reward strong{display:block}.reward small{color:var(--muted)}.points{font-size:24px;font-weight:850;color:var(--brand)}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:15px;z-index:10}.modal>form,.modal>div{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:20px;padding:20px;box-shadow:0 20px 70px #0006}.modal[hidden]{display:none}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal h2{margin:0}.fields{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:20;font-weight:700}.hide{display:none!important}
@media(max-width:850px){.layout{display:block}.side{display:none}.main{padding:16px 14px 90px}.mobile-nav{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:8;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px}.mobile-nav button{border:0;background:transparent;color:var(--muted);padding:8px 2px;font-size:11px;font-weight:700}.mobile-nav button.active{color:var(--brand)}.stats{grid-template-columns:1fr 1fr}.members{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.hero{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}.day{min-height:85px}.title h1{font-size:25px}.task{grid-template-columns:auto 1fr}.task-actions{grid-column:2}.row{grid-template-columns:1fr}}
@media(max-width:520px){.members{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.hero h2{font-size:26px}.calendar{grid-template-columns:1fr 1fr}.top{align-items:flex-start}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast hide"></div>
<script>
(()=>{const KEY='familyflow-v2';const colors=['#2d7a61','#b85b50','#4c6f9f','#8b6a32','#76559a','#3f8290'];
const people=[['dad','Dad'],['mom','Mom'],['fawad','Fawad'],['hammad','Hammad'],['tayyaba','Tayyaba'],['areeba','Areeba']];
const cats=['Chores','School','Study','Bills','Shopping','Home','Health','Events','Other'];
const rewards=[['movie','Choose family movie',100],['dessert','Choose dessert',150],['outing','Choose weekend outing',300],['treat','Special family treat',500]];
const nav=[['dashboard','⌂','Dashboard'],['tasks','✓','Tasks'],['calendar','▦','Calendar'],['family','♧','Family'],['stats','★','Stats']];
let state=load(),view=location.hash.slice(2)||'dashboard',filter={q:'',person:'all',priority:'all',status:'all',category:'all'},editId=null;
function fresh(){return{tasks:[],points:Object.fromEntries(people.map(p=>[p[0],0])),activity:[],rewards:[],theme:'light',notifications:false,recurring:{}}}
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()}
function esc(x=''){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function person(id){return people.find(p=>p[0]===id)||['all','Everyone']}
function today(){return new Date().toISOString().slice(0,10)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),2200)}
function log(text,member=''){state.activity.unshift({id:uid(),text,member,date:new Date().toISOString()});state.activity=state.activity.slice(0,80)}
function stats(){const all=state.tasks,done=all.filter(t=>t.done),open=all.filter(t=>!t.done),over=all.filter(t=>!t.done&&t.due&&t.due<today());return{all,done,open,over}}
function dueLabel(t){if(!t.due)return 'No due date';if(t.due<today()&&!t.done)return 'Overdue';if(t.due===today())return 'Today';return new Date(t.due+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function taskHtml(t){const p=person(t.assignee);const pr=t.priority||'medium';return '<article class="task '+(t.done?'done':'')+'" style="--c:'+((people.findIndex(x=>x[0]===t.assignee)>=0)?colors[people.findIndex(x=>x[0]===t.assignee)%colors.length]:'var(--brand)')+'"><button class="check '+(t.done?'on':'')+'" data-act="toggle" data-id="'+t.id+'">'+(t.done?'✓':'')+'</button><div><div class="task-name">'+esc(t.title)+'</div>'+(t.description?'<div class="desc">'+esc(t.description)+'</div>':'')+'<div class="meta"><span class="badge '+pr+'">'+pr[0].toUpperCase()+pr.slice(1)+'</span><span class="badge">'+esc(t.category||'General')+'</span><span class="badge '+(t.due&&t.due<today()&&!t.done?'over':'')+'">'+dueLabel(t)+'</span><span class="badge">'+esc(p[1])+'</span>'+(t.repeat&&t.repeat!=='none'?'<span class="badge">↻ '+esc(t.repeat)+'</span>':'')+'</div></div><div class="task-actions"><button class="icon" data-act="edit" data-id="'+t.id+'" aria-label="Edit">✎</button><button class="icon" data-act="delete" data-id="'+t.id+'" aria-label="Delete">×</button></div></article>'}
function taskList(){let a=state.tasks.filter(t=>(!filter.q||t.title.toLowerCase().includes(filter.q.toLowerCase())||t.description.toLowerCase().includes(filter.q.toLowerCase()))&&(filter.person==='all'||t.assignee===filter.person)&&(filter.priority==='all'||t.priority===filter.priority)&&(filter.category==='all'||t.category===filter.category)&&(filter.status==='all'||(filter.status==='open'&&!t.done)||(filter.status==='done'&&t.done)));return a.sort((x,y)=>(x.done-y.done)||((x.due||'9999').localeCompare(y.due||'9999')));return a}
function dashboard(){const s=stats(),pct=s.all.length?Math.round(s.done.length/s.all.length*100):0;return '<div class="hero"><div><p>FamilyFlow</p><h2>Family tasks, together.</h2><p>'+pct+'% of your tasks are complete. Keep the family moving.</p><div class="progress"><i style="width:'+pct+'%"></i></div></div><button class="btn" data-act="add">＋ Add task</button></div><div class="grid stats"><div class="card stat"><b>'+s.open.length+'</b><span>Open tasks</span></div><div class="card stat"><b>'+s.done.length+'</b><span>Completed</span></div><div class="card stat"><b>'+s.over.length+'</b><span>Overdue</span></div><div class="card stat"><b>'+people.reduce((n,p)=>n+(state.points[p[0]]||0),0)+'</b><span>Family points</span></div></div><div class="section"><div class="section-head"><h2>Due soon</h2><button class="btn" data-nav="tasks">View all</button></div><div class="tasks">'+(s.open.filter(t=>!t.due||t.due<=addDays(today(),3)).slice(0,5).map(taskHtml).join('')||'<div class="empty">No urgent tasks. Nice work!</div>')+'</div></div><div class="section"><div class="section-head"><h2>Family activity</h2><button class="btn" data-nav="family">Open family</button></div>'+feed(5)+'</div>'}
function tasksView(){return '<div class="filters"><input class="input" id="search" placeholder="Search tasks..." value="'+esc(filter.q)+'"><select class="select" data-filter="person"><option value="all">Everyone</option>'+people.map(p=>'<option '+(filter.person===p[0]?'selected':'')+' value="'+p[0]+'">'+p[1]+'</option>').join('')+'</select><select class="select" data-filter="priority"><option value="all">All priorities</option>'+['high','medium','low'].map(x=>'<option '+(filter.priority===x?'selected':'')+'>'+x+'</option>').join('')+'</select><select class="select" data-filter="status"><option value="all">All status</option><option value="open" '+(filter.status==='open'?'selected':'')+'>Open</option><option value="done" '+(filter.status==='done'?'selected':'')+'>Completed</option></select><select class="select" data-filter="category"><option value="all">All categories</option>'+cats.map(x=>'<option '+(filter.category===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="tasks">'+(taskList().map(taskHtml).join('')||'<div class="empty">No tasks match these filters.</div>')+'</div>'}
function calendar(){const d=new Date();const y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),days=[];for(let i=0;i<first.getDay();i++)days.push('<div></div>');for(let n=1;n<=last.getDate();n++){const ds=new Date(y,m,n).toISOString().slice(0,10),ts=state.tasks.filter(t=>t.due===ds);days.push('<div class="day '+(ds===today()?'today':'')+'"><strong>'+n+'</strong>'+ts.slice(0,4).map(t=>'<div class="mini">'+esc(t.title)+'</div>').join('')+'</div>')}return '<div class="card"><h2>'+d.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</h2><div class="calendar" style="margin-top:12px">'+days.join('')+'</div></div>'}
function family(){return '<div class="grid members">'+people.map((p,i)=>{const ts=state.tasks.filter(t=>t.assignee===p[0]),done=ts.filter(t=>t.done).length;return '<div class="member" style="--c:'+colors[i%colors.length]+'"><div class="member-head"><div class="avatar">'+p[1][0]+'</div><div><h3>'+p[1]+'</h3><small>'+done+'/'+ts.length+' tasks complete</small></div></div><div class="member-nums"><span><b>'+((state.points[p[0]]||0))+'</b><small>points</small></span><span><b>'+ts.filter(t=>!t.done).length+'</b><small>open</small></span></div></div>'}).join('')}</div><div class="section"><div class="section-head"><h2>Rewards</h2><span class="points">'+people.reduce((n,p)=>n+(state.points[p[0]]||0),0)+' pts</span></div><div class="grid">'+rewards.map(r=>'<div class="card reward"><div><strong>'+r[1]+'</strong><small>'+r[2]+' family points</small></div><button class="btn primary" data-act="reward" data-reward="'+r[0]+'">Redeem</button></div>').join('')+'</div></div><div class="section"><div class="section-head"><h2>Activity</h2></div>'+feed(12)+'</div>'}
function feed(n){return '<div class="card feed">'+(state.activity.slice(0,n).map(a=>'<div class="feed-item"><div class="avatar" style="width:34px;height:34px;font-size:13px">'+esc(person(a.member)[1][0])+'</div><div><b>'+esc(a.text)+'</b><div class="desc">'+new Date(a.date).toLocaleString()+'</div></div></div>').join('')||'<div class="empty">Activity will appear here as your family uses the app.</div>')+'</div>'}
function statsView(){const s=stats();return '<div class="grid stats"><div class="card stat"><b>'+s.all.length+'</b><span>Total tasks</span></div><div class="card stat"><b>'+s.done.length+'</b><span>Completed</span></div><div class="card stat"><b>'+s.over.length+'</b><span>Overdue</span></div><div class="card stat"><b>'+Math.round((s.done.length/(s.all.length||1))*100)+'%</b><span>Completion rate</span></div></div><div class="section card"><h2>By member</h2>'+people.map((p,i)=>{const ts=state.tasks.filter(t=>t.assignee===p[0]),d=ts.filter(t=>t.done).length,pc=Math.round(d/(ts.length||1)*100);return '<div style="margin:16px 0"><div style="display:flex;justify-content:space-between"><b>'+p[1]+'</b><span>'+d+'/'+ts.length+' · '+pc+'%</span></div><div class="progress" style="background:var(--soft)"><i style="width:'+pc+'%;background:'+colors[i%colors.length]+'"></i></div></div>'}).join('')+'</div><div class="section">'+feed(20)+'</div>'}
function settings(){return '<div class="grid"><div class="card"><h2>Appearance</h2><p class="desc">Choose how FamilyFlow looks.</p><select class="select" id="theme" style="margin-top:12px"><option value="light" '+(state.theme==='light'?'selected':'')+'>Light</option><option value="dark" '+(state.theme==='dark'?'selected':'')+'>Dark</option><option value="system" '+(state.theme==='system'?'selected':'')+'>System</option></select></div><div class="card"><h2>Reminders</h2><p class="desc">Allow browser notifications for due tasks.</p><button class="btn primary" data-act="notify" style="margin-top:12px">'+(state.notifications?'Notifications enabled':'Enable notifications')+'</button></div><div class="card"><h2>Data</h2><p class="desc">Your current version stores data on this device/browser. Export a backup before moving devices.</p><div class="actions" style="margin-top:12px"><button class="btn" data-act="export">Export backup</button><button class="btn" data-act="import">Import backup</button><button class="btn danger" data-act="reset">Reset data</button></div></div><div class="card"><h2>Family profiles</h2><p class="desc">Member names are shown without occupation or profession descriptions.</p><div class="meta" style="margin-top:10px">'+people.map(p=>'<span class="badge">'+p[1]+'</span>').join('')+'</div></div></div>'}
function shell(body){return '<div class="layout"><aside class="side"><div class="logo"><i>✓</i>FamilyFlow</div><div class="nav">'+nav.map(n=>'<button class="'+(view===n[0]?'active':'')+'" data-nav="'+n[0]+'">'+n[1]+' &nbsp; '+n[2]+'</button>').join('')+'<button class="'+(view==='settings'?'active':'')+'" data-nav="settings">⚙ &nbsp; Settings</button></div><div class="side-bottom"><button class="btn primary" style="width:100%" data-act="add">＋ Add task</button></div></aside><main class="main"><header class="top"><div class="title"><h1>'+nav.concat([['settings','⚙','Settings']]).find(n=>n[0]===view)[2]+'</h1><p>'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</p></div><div class="actions"><button class="btn" data-act="theme">☾</button><button class="btn primary" data-act="add">＋ Add task</button></div></header>'+body+'</main></div><nav class="mobile-nav">'+nav.map(n=>'<button class="'+(view===n[0]?'active':'')+'" data-nav="'+n[0]+'">'+n[1]+'<br>'+n[2]+'</button>').join('')+'</nav>'}
function render(){document.documentElement.dataset.theme=state.theme==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):state.theme;let body=view==='dashboard'?dashboard():view==='tasks'?tasksView():view==='calendar'?calendar():view==='family'?family():view==='stats'?statsView():settings();document.getElementById('app').innerHTML=shell(body)}
function modal(task){const t=task||{title:'',description:'',assignee:people[0][0],priority:'medium',due:today(),category:'Chores',repeat:'none',points:10};document.getElementById('modal').innerHTML='<form id="taskform"><div class="modal-head"><h2>'+(task?'Edit task':'New family task')+'</h2><button type="button" class="icon" data-act="close">×</button></div><div class="fields"><div><label class="label">Task title</label><input class="input" name="title" required maxlength="120" value="'+esc(t.title)+'"></div><div><label class="label">Description / notes</label><textarea class="textarea" name="description" maxlength="500">'+esc(t.description||'')+'</textarea></div><div class="row"><div><label class="label">Assigned to</label><select class="select" name="assignee">'+people.map(p=>'<option value="'+p[0]+'" '+(t.assignee===p[0]?'selected':'')+'>'+p[1]+'</option>').join('')+'</select></div><div><label class="label">Priority</label><select class="select" name="priority">'+['high','medium','low'].map(x=>'<option '+(t.priority===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><div class="row"><div><label class="label">Due date</label><input class="input" type="date" name="due" value="'+esc(t.due||'')+'"></div><div><label class="label">Category</label><select class="select" name="category">'+cats.map(x=>'<option '+(t.category===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><div class="row"><div><label class="label">Repeat</label><select class="select" name="repeat"><option value="none">Does not repeat</option><option value="daily" '+(t.repeat==='daily'?'selected':'')+'>Daily</option><option value="weekly" '+(t.repeat==='weekly'?'selected':'')+'>Weekly</option><option value="monthly" '+(t.repeat==='monthly'?'selected':'')+'>Monthly</option></select></div><div><label class="label">Points</label><input class="input" type="number" min="1" max="500" name="points" value="'+(t.points||10)+'"></div></div></div><div class="modal-foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Save task</button></div></form>';document.getElementById('modal').hidden=false;editId=task?.id||null}
function closeModal(){document.getElementById('modal').hidden=true;editId=null}
document.addEventListener('click',e=>{const navb=e.target.closest('[data-nav]');if(navb){view=navb.dataset.nav;location.hash='#/'+view;render();return}const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
if(a==='add'){modal()}else if(a==='close')closeModal();else if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';save();render()}else if(a==='edit'){modal(state.tasks.find(t=>t.id===id))}else if(a==='toggle'){const t=state.tasks.find(t=>t.id===id);if(!t)return;t.done=!t.done;if(t.done){state.points[t.assignee]=(state.points[t.assignee]||0)+(t.points||10);log(person(t.assignee)[1]+' completed “'+t.title+'”',t.assignee);if(t.repeat&&t.repeat!=='none'){const next=t.repeat==='daily'?addDays(t.due||today(),1):t.repeat==='weekly'?addDays(t.due||today(),7):addDays(t.due||today(),30);state.tasks.push({...t,id:uid(),done:false,due:next,created:new Date().toISOString()})}}save();render();toast(t.done?'Task completed +'+(t.points||10)+' points':'Task reopened')}else if(a==='delete'){if(confirm('Delete this task?')){state.tasks=state.tasks.filter(t=>t.id!==id);save();render();toast('Task deleted')}}else if(a==='reward'){const r=rewards.find(x=>x[0]===b.dataset.reward),total=people.reduce((n,p)=>n+(state.points[p[0]]||0),0);if(total<r[2])return toast('Not enough family points');let left=r[2];for(const p of people){const take=Math.min(left,state.points[p[0]]||0);state.points[p[0]]-=take;left-=take;if(!left)break}state.rewards.unshift({name:r[1],date:new Date().toISOString()});log('Family redeemed “'+r[1]+'”');save();render();toast('Reward redeemed')}else if(a==='notify'){if(!('Notification'in window))return toast('Notifications are not supported here');Notification.requestPermission().then(x=>{state.notifications=x==='granted';save();render();toast(x==='granted'?'Notifications enabled':'Notifications not enabled')})}else if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='familyflow-backup.json';a.click();URL.revokeObjectURL(u)}else if(a==='import'){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{state=Object.assign(fresh(),JSON.parse(r.result));save();render();toast('Backup imported')}catch{toast('Invalid backup')}};r.readAsText(i.files[0])};i.click()}else if(a==='reset'){if(confirm('Erase all FamilyFlow data on this device?')){state=fresh();save();render();toast('Data reset')}}});
document.addEventListener('submit',e=>{if(e.target.id!=='taskform')return;e.preventDefault();const f=new FormData(e.target),data={title:String(f.get('title')).trim(),description:String(f.get('description')).trim(),assignee:f.get('assignee'),priority:f.get('priority'),due:f.get('due'),category:f.get('category'),repeat:f.get('repeat'),points:Math.max(1,Math.min(500,Number(f.get('points'))||10))};if(!data.title)return;if(editId){Object.assign(state.tasks.find(t=>t.id===editId),data);log('Task updated: “'+data.title+'”',data.assignee)}else{state.tasks.push({id:uid(),...data,done:false,created:new Date().toISOString()});log(person(data.assignee)[1]+' was assigned “'+data.title+'”',data.assignee)}save();closeModal();render();toast(editId?'Task updated':'Task added')});
document.addEventListener('input',e=>{if(e.target.id==='search'){filter.q=e.target.value;render()}});document.addEventListener('change',e=>{if(e.target.dataset.filter){filter[e.target.dataset.filter]=e.target.value;render()}if(e.target.id==='theme'){state.theme=e.target.value;save();render()}});window.addEventListener('hashchange',()=>{view=location.hash.slice(2)||'dashboard';render()});setInterval(()=>{if(state.notifications&&Notification.permission==='granted'){const t=state.tasks.find(t=>!t.done&&t.due===today());if(t)try{new Notification('FamilyFlow reminder',{body:t.title})}catch{}}},3600000);render();
})();
</script>
</body>
</html>
