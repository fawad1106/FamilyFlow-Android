<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5c4a">
<meta name="description" content="FamilyFlow — family tasks, rewards and planning.">
<title>FamilyFlow</title>
<style>
:root{--bg:#f4f7f4;--card:#fff;--soft:#e8eee9;--text:#17221e;--muted:#66756e;--line:#dce4de;--brand:#1f5c4a;--brand2:#dcebe4;--danger:#b43a30;--warn:#a56b08;--shadow:0 8px 28px #17221e12;--r:18px}
[data-theme=dark]{--bg:#0e1613;--card:#16211d;--soft:#1e2c27;--text:#e7eee9;--muted:#9aaba3;--line:#2b3a34;--brand:#65c7a2;--brand2:#193b30;--shadow:0 8px 28px #0008}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}.app{min-height:100vh}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--card);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:6px 10px 22px}.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--brand);color:#fff;font-style:normal}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;padding:12px;border-radius:12px;text-align:left;font-weight:650;color:var(--muted)}.nav button.active,.nav button:hover{background:var(--brand2);color:var(--brand)}.side-bottom{position:absolute;bottom:20px;left:14px;right:14px}.main{width:min(1100px,100%);padding:24px 28px 70px;margin:auto}.mobile-nav{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title h1{font-size:30px;margin:0}.title p{margin:5px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);padding:10px 15px;border-radius:12px;font-weight:700}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.ghost{background:transparent}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}.stat b{display:block;font-size:27px}.stat span{color:var(--muted)}.hero{background:var(--brand);color:#fff;border-radius:24px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-bottom:15px}.hero h2{font-size:32px;margin:4px 0}.hero p{color:#d9eee5}.progress{height:10px;background:#ffffff25;border-radius:99px;overflow:hidden;margin-top:15px}.progress i{display:block;height:100%;background:#fff;border-radius:99px}.section{margin-top:24px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h2{font-size:19px;margin:0}.tasks{display:grid;gap:9px}.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:13px;border:1px solid var(--line);border-left:5px solid var(--c,var(--line));border-radius:15px;background:var(--card)}.task.done{opacity:.65}.task.done .task-name{text-decoration:line-through}.check{width:27px;height:27px;border-radius:50%;border:2px solid var(--muted);background:transparent;color:transparent}.check.on{background:var(--brand);border-color:var(--brand);color:#fff}.task-name{font-weight:750}.desc{color:var(--muted);margin-top:3px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{font-size:11px;font-weight:750;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}.high{background:#f8dfdc;color:#a52e26}.medium{background:#f8ecd1;color:#8a5c08}.low{background:#e2e8f3;color:#405c8e}.over{background:#f8dfdc;color:#a52e26}.task-actions{display:flex;gap:4px}.icon{border:0;background:transparent;padding:7px;border-radius:9px}.icon:hover{background:var(--soft)}.members{grid-template-columns:repeat(3,1fr)}.member{border:1px solid var(--line);border-top:5px solid var(--c);padding:16px;border-radius:15px;background:var(--card)}.member-head{display:flex;gap:11px;align-items:center}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:800}.member h3{margin:0}.member small{color:var(--muted)}.member-nums{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}.member-nums span{background:var(--soft);padding:8px;border-radius:10px}.member-nums b{font-size:19px}.member-nums small{display:block}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;margin-bottom:13px}.input,.select,.textarea{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--card);border-radius:11px}.textarea{min-height:90px;resize:vertical}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:100px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}.day strong{display:block}.day.today{outline:2px solid var(--brand)}.mini{font-size:11px;margin-top:6px;padding:5px 6px;border-radius:7px;background:var(--brand2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.feed{display:grid;gap:9px}.feed-item{display:flex;gap:10px;padding:11px;border-bottom:1px solid var(--line)}.reward{display:flex;align-items:center;justify-content:space-between;gap:12px}.reward strong{display:block}.reward small{color:var(--muted)}.points{font-size:24px;font-weight:850;color:var(--brand)}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:15px;z-index:10}.modal>form,.modal>div{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:20px;padding:20px;box-shadow:0 20px 70px #0006}.modal[hidden]{display:none}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal h2{margin:0}.fields{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:20;font-weight:700}.hide{display:none!important}
@media(max-width:850px){.layout{display:block}.side{display:none}.main{padding:16px 14px 90px}.mobile-nav{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:8;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px}.mobile-nav button{border:0;background:transparent;color:var(--muted);padding:8px 2px;font-size:11px;font-weight:700}.mobile-nav button.active{color:var(--brand)}.stats{grid-template-columns:1fr 1fr}.members{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.hero{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}.day{min-height:85px}.title h1{font-size:25px}.task{grid-template-columns:auto 1fr}.task-actions{grid-column:2}.row{grid-template-columns:1fr}}
@media(max-width:520px){.members{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.hero h2{font-size:26px}.calendar{grid-template-columns:1fr 1fr}.top{align-items:flex-start}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast hide"></div>
<script>
(()=> {
  const KEY='familyflow-v3';
  const people=[['dad','Dad'],['mom','Mom'],['fawad','Fawad'],['hammad','Hammad'],['tayyaba','Tayyaba'],['areeba','Areeba']];
  const colors=['#2d7a61','#b85b50','#4c6f9f','#8b6a32','#76559a','#3f8290'];
  const cats=['Chores','School','Study','Bills','Shopping','Home','Health','Events','Other'];
  const nav=[['dashboard','⌂','Dashboard'],['tasks','✓','Tasks'],['calendar','▦','Calendar'],['family','♧','Family'],['stats','★','Stats'],['settings','⚙','Settings']];
  let view=location.hash.slice(2)||'dashboard';
  let filter={q:'',person:'all',status:'all'};
  let state;
  try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){state=null}
  if(!state||!Array.isArray(state.tasks))state={tasks:[],points:{},activity:[],theme:'light'};
  people.forEach(p=>{if(typeof state.points[p[0]]!=='number')state.points[p[0]]=0});
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]})}
  function today(){return new Date().toISOString().slice(0,10)}
  function uid(){return 't'+Date.now()+Math.random().toString(16).slice(2)}
  function person(id){return people.find(function(p){return p[0]===id})||['','Everyone']}
  function log(text,member){state.activity.unshift({text:text,member:member||'',date:new Date().toISOString()});state.activity=state.activity.slice(0,50)}
  function taskHtml(t){var p=person(t.assignee),idx=Math.max(0,people.findIndex(function(x){return x[0]===t.assignee}));return '<article class="task '+(t.done?'done':'')+'" style="--c:'+colors[idx]+'"><button class="check '+(t.done?'on':'')+'" data-act="toggle" data-id="'+esc(t.id)+'">'+(t.done?'✓':'')+'</button><div><div class="task-name">'+esc(t.title)+'</div>'+(t.description?'<div class="desc">'+esc(t.description)+'</div>':'')+'<div class="meta"><span class="badge">'+esc(t.priority||'medium')+'</span><span class="badge">'+esc(t.category||'General')+'</span><span class="badge">'+esc(p[1])+'</span>'+(t.due?'<span class="badge">'+esc(t.due)+'</span>':'')+'</div></div><div class="task-actions"><button class="icon" data-act="edit" data-id="'+esc(t.id)+'">✎</button><button class="icon" data-act="delete" data-id="'+esc(t.id)+'">×</button></div></article>'}
  function list(){return state.tasks.filter(function(t){return (!filter.q||String(t.title).toLowerCase().includes(filter.q.toLowerCase()))&&(filter.person==='all'||t.assignee===filter.person)&&(filter.status==='all'||(filter.status==='open'&&!t.done)||(filter.status==='done'&&t.done))})}
  function feed(){return '<div class="card feed">'+(state.activity.slice(0,10).map(function(a){return '<div class="feed-item"><div class="avatar" style="width:34px;height:34px">'+esc(person(a.member)[1][0])+'</div><div><b>'+esc(a.text)+'</b><div class="desc">'+new Date(a.date).toLocaleString()+'</div></div></div>'}).join('')||'<div class="empty">No activity yet.</div>')+'</div>'}
  function dashboard(){var done=state.tasks.filter(function(t){return t.done}).length,total=state.tasks.length,pct=total?Math.round(done/total*100):0;return '<div class="hero"><div><p>FamilyFlow</p><h2>Family tasks, together.</h2><p>'+pct+'% complete.</p><div class="progress"><i style="width:'+pct+'%"></i></div></div><button class="btn" data-act="add">＋ Add task</button></div><div class="grid stats"><div class="card stat"><b>'+state.tasks.filter(function(t){return !t.done}).length+'</b><span>Open tasks</span></div><div class="card stat"><b>'+done+'</b><span>Completed</span></div><div class="card stat"><b>'+state.tasks.filter(function(t){return !t.done&&t.due&&t.due<today()}).length+'</b><span>Overdue</span></div><div class="card stat"><b>'+Object.values(state.points).reduce(function(a,b){return a+b},0)+'</b><span>Family points</span></div></div><div class="section"><div class="section-head"><h2>Tasks</h2><button class="btn" data-nav="tasks">View all</button></div><div class="tasks">'+(state.tasks.slice(0,6).map(taskHtml).join('')||'<div class="empty">No tasks yet. Add your first family task.</div>')+'</div></div><div class="section"><h2>Family activity</h2>'+feed()+'</div>'}
  function tasks(){return '<div class="filters"><input class="input" id="search" placeholder="Search tasks..." value="'+esc(filter.q)+'"><select class="select" data-filter="person"><option value="all">Everyone</option>'+people.map(function(p){return '<option value="'+p[0]+'" '+(filter.person===p[0]?'selected':'')+'>'+p[1]+'</option>'}).join('')+'</select><select class="select" data-filter="status"><option value="all">All status</option><option value="open" '+(filter.status==='open'?'selected':'')+'>Open</option><option value="done" '+(filter.status==='done'?'selected':'')+'>Completed</option></select></div><div class="tasks">'+(list().map(taskHtml).join('')||'<div class="empty">No tasks found.</div>')+'</div>'}
  function family(){return '<div class="grid members">'+people.map(function(p,i){var ts=state.tasks.filter(function(t){return t.assignee===p[0]}),d=ts.filter(function(t){return t.done}).length;return '<div class="member" style="--c:'+colors[i]+'"><div class="member-head"><div class="avatar">'+p[1][0]+'</div><div><h3>'+p[1]+'</h3><small>'+d+'/'+ts.length+' tasks complete</small></div></div><div class="member-nums"><span><b>'+state.points[p[0]]+'</b><small>points</small></span><span><b>'+ts.filter(function(t){return !t.done}).length+'</b><small>open</small></span></div></div>'}).join('')+'</div><div class="section"><h2>Activity</h2>'+feed()+'</div>'}
  function calendar(){var ds=today();return '<div class="card"><h2>'+new Date().toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</h2><div class="tasks" style="margin-top:15px">'+(state.tasks.filter(function(t){return t.due===ds}).map(taskHtml).join('')||'<div class="empty">No tasks due today.</div>')+'</div></div>'}
  function stats(){var total=state.tasks.length,done=state.tasks.filter(function(t){return t.done}).length;return '<div class="grid stats"><div class="card stat"><b>'+total+'</b><span>Total tasks</span></div><div class="card stat"><b>'+done+'</b><span>Completed</span></div><div class="card stat"><b>'+Math.round(done/(total||1)*100)+'%</b><span>Completion rate</span></div><div class="card stat"><b>'+Object.values(state.points).reduce(function(a,b){return a+b},0)+'</b><span>Points</span></div></div><div class="section"><h2>Activity</h2>'+feed()+'</div>'}
  function settings(){return '<div class="grid"><div class="card"><h2>Appearance</h2><p class="desc">Choose the theme.</p><select id="theme" class="select"><option value="light" '+(state.theme==='light'?'selected':'')+'>Light</option><option value="dark" '+(state.theme==='dark'?'selected':'')+'>Dark</option></select></div><div class="card"><h2>Family profiles</h2><p class="desc">Occupation/profession descriptions have been removed.</p><div class="meta">'+people.map(function(p){return '<span class="badge">'+p[1]+'</span>'}).join('')+'</div></div></div>'}
  function shell(body){var title=(nav.find(function(n){return n[0]===view})||nav[0])[2];return '<div class="layout"><aside class="side"><div class="logo"><i>✓</i>FamilyFlow</div><div class="nav">'+nav.map(function(n){return '<button class="'+(view===n[0]?'active':'')+'" data-nav="'+n[0]+'">'+n[1]+' &nbsp; '+n[2]+'</button>'}).join('')+'</div><div class="side-bottom"><button class="btn primary" style="width:100%" data-act="add">＋ Add task</button></div></aside><main class="main"><header class="top"><div class="title"><h1>'+title+'</h1><p>'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</p></div><div class="actions"><button class="btn" data-act="theme">☾</button><button class="btn primary" data-act="add">＋ Add task</button></div></header>'+body+'</main></div><nav class="mobile-nav">'+nav.slice(0,5).map(function(n){return '<button class="'+(view===n[0]?'active':'')+'" data-nav="'+n[0]+'">'+n[1]+'<br>'+n[2]+'</button>'}).join('')+'</nav>'}
  function render(){document.documentElement.dataset.theme=state.theme==='dark'?'dark':'light';var body=view==='dashboard'?dashboard():view==='tasks'?tasks():view==='calendar'?calendar():view==='family'?family():view==='stats'?stats():settings();document.getElementById('app').innerHTML=shell(body)}
  function modal(task){task=task||{title:'',description:'',assignee:'dad',priority:'medium',due:today(),category:'Chores',points:10};document.getElementById('modal').innerHTML='<form id="taskform"><div class="modal-head"><h2>'+ (task.id?'Edit task':'New family task') +'</h2><button type="button" class="icon" data-act="close">×</button></div><div class="fields"><div><label class="label">Task title</label><input class="input" name="title" required value="'+esc(task.title)+'"></div><div><label class="label">Description</label><textarea class="textarea" name="description">'+esc(task.description||'')+'</textarea></div><div class="row"><div><label class="label">Assigned to</label><select class="select" name="assignee">'+people.map(function(p){return '<option value="'+p[0]+'" '+(task.assignee===p[0]?'selected':'')+'>'+p[1]+'</option>'}).join('')+'</select></div><div><label class="label">Priority</label><select class="select" name="priority">'+['high','medium','low'].map(function(x){return '<option '+(task.priority===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select></div></div><div class="row"><div><label class="label">Due date</label><input class="input" type="date" name="due" value="'+esc(task.due||'')+'"></div><div><label class="label">Category</label><select class="select" name="category">'+cats.map(function(x){return '<option '+(task.category===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select></div></div><div><label class="label">Points</label><input class="input" type="number" name="points" min="1" max="500" value="'+(task.points||10)+'"></div></div><div class="modal-foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Save task</button></div></form>';document.getElementById('modal').hidden=false;window.editId=task.id||null}
  function closeModal(){document.getElementById('modal').hidden=true;window.editId=null}
  document.addEventListener('click',function(e){var n=e.target.closest('[data-nav]');if(n){view=n.dataset.nav;location.hash='#/'+view;render();return}var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,id=b.dataset.id;if(a==='add')modal();else if(a==='close')closeModal();else if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';save();render()}else if(a==='toggle'){var t=state.tasks.find(function(x){return x.id===id});if(t){t.done=!t.done;if(t.done)state.points[t.assignee]=(state.points[t.assignee]||0)+(t.points||10);log((t.done?'Completed ':'Reopened ')+t.title,t.assignee);save();render()}}else if(a==='edit'){var t=state.tasks.find(function(x){return x.id===id});if(t)modal(t)}else if(a==='delete'){if(confirm('Delete this task?')){state.tasks=state.tasks.filter(function(x){return x.id!==id});save();render()}}});
  document.addEventListener('submit',function(e){if(e.target.id!=='taskform')return;e.preventDefault();var f=new FormData(e.target),data={title:String(f.get('title')).trim(),description:String(f.get('description')).trim(),assignee:String(f.get('assignee')),priority:String(f.get('priority')),due:String(f.get('due')),category:String(f.get('category')),points:Number(f.get('points'))||10};if(window.editId){var t=state.tasks.find(function(x){return x.id===window.editId});if(t)Object.assign(t,data);log('Updated '+data.title,data.assignee)}else{state.tasks.push(Object.assign({id:uid(),done:false,created:new Date().toISOString()},data));log('Assigned '+data.title,data.assignee)}save();closeModal();render()});
  document.addEventListener('input',function(e){if(e.target.id==='search'){filter.q=e.target.value;render()}});
  document.addEventListener('change',function(e){if(e.target.dataset.filter){filter[e.target.dataset.filter]=e.target.value;render()}if(e.target.id==='theme'){state.theme=e.target.value;save();render()}});
  window.addEventListener('hashchange',function(){view=location.hash.slice(2)||'dashboard';render()});
  render();
})();
</script>
</body>
</html>
