<!doctype html>
<html lang="en">
<head>
<!-- GitHub Pages redeploy trigger -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5c4a">
<meta name="description" content="LifeQuest — turn real life goals into quests, XP and rewards.">
<title>LifeQuest</title>
<style>
:root{--bg:#f4f7f4;--card:#fff;--soft:#e8eee9;--text:#17221e;--muted:#66756e;--line:#dce4de;--brand:#6c4cff;--brand2:#eeeaff;--danger:#b43a30;--warn:#a56b08;--shadow:0 8px 28px #17221e12;--r:18px}
[data-theme=dark]{--bg:#0e1613;--card:#16211d;--soft:#1e2c27;--text:#e7eee9;--muted:#9aaba3;--line:#2b3a34;--brand:#a99aff;--brand2:#292246;--shadow:0 8px 28px #0008}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}.app{min-height:100vh}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--card);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:6px 10px 22px}.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--brand);color:#fff;font-style:normal}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;padding:12px;border-radius:12px;text-align:left;font-weight:650;color:var(--muted)}.nav button.active,.nav button:hover{background:var(--brand2);color:var(--brand)}.side-bottom{position:absolute;bottom:20px;left:14px;right:14px}.main{width:min(1100px,100%);padding:24px 28px 70px;margin:auto}.mobile-nav{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title h1{font-size:30px;margin:0}.title p{margin:5px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);padding:10px 15px;border-radius:12px;font-weight:700}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.ghost{background:transparent}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}.stat b{display:block;font-size:27px}.stat span{color:var(--muted)}.hero{background:var(--brand);color:#fff;border-radius:24px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-bottom:15px}.hero .btn{background:#fff;color:var(--brand);border-color:#fff;justify-self:start;width:auto;white-space:nowrap}.hero h2{font-size:32px;margin:4px 0}.hero p{color:#d9eee5}.progress{height:10px;background:#ffffff25;border-radius:99px;overflow:hidden;margin-top:15px}.progress i{display:block;height:100%;background:#fff;border-radius:99px}.section{margin-top:24px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h2{font-size:19px;margin:0}.tasks{display:grid;gap:9px}.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:13px;border:1px solid var(--line);border-left:5px solid var(--c,var(--line));border-radius:15px;background:var(--card)}.task.done{opacity:.65}.task.done .task-name{text-decoration:line-through}.check{width:27px;height:27px;border-radius:50%;border:2px solid var(--muted);background:transparent;color:transparent}.check.on{background:var(--brand);border-color:var(--brand);color:#fff}.task-name{font-weight:750}.desc{color:var(--muted);margin-top:3px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{font-size:11px;font-weight:750;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}.high{background:#f8dfdc;color:#a52e26}.medium{background:#f8ecd1;color:#8a5c08}.low{background:#e2e8f3;color:#405c8e}.over{background:#f8dfdc;color:#a52e26}.task-actions{display:flex;gap:4px}.icon{border:0;background:transparent;padding:7px;border-radius:9px}.icon:hover{background:var(--soft)}.members{grid-template-columns:repeat(3,1fr)}.member{border:1px solid var(--line);border-top:5px solid var(--c);padding:16px;border-radius:15px;background:var(--card)}.member-head{display:flex;gap:11px;align-items:center}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:800}.member h3{margin:0}.member small{color:var(--muted)}.member-nums{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}.member-nums span{background:var(--soft);padding:8px;border-radius:10px}.member-nums b{font-size:19px}.member-nums small{display:block}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;margin-bottom:13px}.input,.select,.textarea{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--card);border-radius:11px}.textarea{min-height:90px;resize:vertical}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:100px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}.day strong{display:block}.day.today{outline:2px solid var(--brand)}.mini{font-size:11px;margin-top:6px;padding:5px 6px;border-radius:7px;background:var(--brand2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.feed{display:grid;gap:9px}.feed-item{display:flex;gap:10px;padding:11px;border-bottom:1px solid var(--line)}.reward{display:flex;align-items:center;justify-content:space-between;gap:12px}.reward strong{display:block}.reward small{color:var(--muted)}.points{font-size:24px;font-weight:850;color:var(--brand)}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;background:var(--card);font-weight:600}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:15px;z-index:10}.modal>form,.modal>div{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:20px;padding:20px;box-shadow:0 20px 70px #0006}.modal[hidden]{display:none}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal h2{margin:0}.fields{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:20;font-weight:700}.profile-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}.profile-box{width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow)}.profile-brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:22px;margin-bottom:28px}.profile-brand i{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--brand);color:#fff;font-style:normal}.profile-box h1{font-size:30px;margin:0 0 7px}.profile-box>p{color:var(--muted);margin:0 0 22px}.profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.profile-choice{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;display:flex;align-items:center;gap:12px}.profile-choice:hover{border-color:var(--brand);background:var(--brand2)}.profile-choice .avatar{flex:0 0 46px}.profile-choice b{display:block}.profile-choice small{color:var(--muted)}.current-member{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-weight:750}.current-member .avatar{width:28px;height:28px;font-size:12px}.profile-switch{border:0;background:transparent;color:var(--brand);font-weight:750;padding:5px}.hide{display:none!important}
@media(max-width:850px){.layout{display:block}.side{display:none}.main{padding:16px 14px 90px}.mobile-nav{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:8;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px}.mobile-nav button{border:0;background:transparent;color:var(--muted);padding:8px 2px;font-size:11px;font-weight:700}.mobile-nav button.active{color:var(--brand)}.stats{grid-template-columns:1fr 1fr}.members{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.hero{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}.day{min-height:85px}.title h1{font-size:25px}.task{grid-template-columns:auto 1fr}.task-actions{grid-column:2}.row{grid-template-columns:1fr}}
@media(max-width:520px){.members{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.hero h2{font-size:26px}.calendar{grid-template-columns:1fr 1fr}.top{align-items:flex-start}}
</style>
</head>
<body>
<div id="app"><main class="profile-screen"><section class="profile-box"><div class="profile-brand"><i>✓</i>LifeQuest</div><h1>Loading LifeQuest…</h1><p>Please wait while your family dashboard loads.</p></section></main></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast hide"></div>
<script>
window.addEventListener("error",function(e){var a=document.getElementById("app");if(a&&!a.innerHTML.trim()){a.innerHTML="<main class=\"profile-screen\"><section class=\"profile-box\"><h1>LifeQuest error</h1><p class=\"desc\">"+String(e.message||"Unable to start the app. Please refresh.")+"</p></section></main>"}});
(()=> {
  const SB_URL='https://jsjiysgwymeuugjipyil.supabase.co';
  const SB_KEY='sb_publishable_NGo65OXNEWzmJqSBy9KGuw_kwFQMDAq';
  const SESSION_KEY='lifequest-session';
  const peopleColors=['#2d7a61','#b85b50','#4c6f9f','#8b6a32','#76559a','#3f8290'];
  const nav=[['dashboard','⌂','Dashboard'],['tasks','✓','Tasks'],['rewards','🎁','Rewards'],['family','♧','Family'],['stats','★','Achievements'],['settings','⚙','Settings']];
  let view=location.hash.slice(2)||'dashboard', data=null, members=[], current=null, filter={q:'',status:'all'}, loading=false;

  async function rpc(name,args){
    const r=await fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.message||j.error_description||j.hint||'Request failed');
    return j;
  }
  function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
  function showToast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),2800)}
  function avatar(name,i){return '<span class="avatar" style="--c:'+peopleColors[i%peopleColors.length]+'">'+esc((name||'?')[0])+'</span>'}
  function memberById(id){return members.find(x=>x.id===id)||{id:'',name:'Unknown',initialized:false}}
  function fmtDate(v){return v?new Date(v).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'No date'}
  function today(){return new Date().toISOString().slice(0,10)}
  function getToken(){return sessionStorage.getItem(SESSION_KEY)}
  function setToken(t){if(t)sessionStorage.setItem(SESSION_KEY,t);else sessionStorage.removeItem(SESSION_KEY)}
  async function loadMembers(){members=await rpc('ff_list_members',{});}
  async function loadDashboard(){data=await rpc('ff_dashboard',{p_token:getToken()});current=data.member}
  function go(v){view=v;location.hash='#/'+v;render()}

  function profileScreen(){
    return '<main class="profile-screen"><section class="profile-box"><div class="profile-brand"><i>✓</i>LifeQuest</div><h1>Who is playing LifeQuest?</h1><p>Select your player profile. Your account has its own PIN, XP, achievements and quest history.</p><div class="profile-grid">'+members.map((m,i)=>'<button class="profile-choice" data-member="'+m.id+'">'+avatar(m.name,i)+'<span><b>'+esc(m.name)+'</b><small>'+(m.initialized?'Enter PIN to sign in':'Create your PIN')+'</small></span></button>').join('')+'</div></section></main>';
  }
  function pinScreen(m){
    const first=!m.initialized;
    return '<main class="profile-screen"><section class="profile-box"><button class="btn ghost" data-act="back-members">← Change member</button><div class="profile-brand" style="margin-top:18px">'+avatar(m.name,members.indexOf(m))+'<span>'+esc(m.name)+'</span></div><h1>'+(first?'Create your PIN':'Enter your PIN')+'</h1><p>'+(first?'Choose a 4–8 digit PIN. You will start with 50 points.':'Enter your personal PIN to open your LifeQuest account.')+'</p><form id="pinform"><input class="input" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="'+(first?'new-password':'current-password')+'" placeholder="4–8 digit PIN" required><div class="modal-foot"><button class="btn primary">'+(first?'Create account':'Log in')+'</button></div></form></section></main>';
  }

  function taskCard(t,actions){
    const ass=memberById(t.assignee_id), asg=memberById(t.assigner_id), i=Math.max(0,members.findIndex(m=>m.id===t.assignee_id));
    const done=t.status==='completed', rejected=t.status==='rejected';
    return '<article class="task '+(done||rejected?'done':'')+'" style="--c:'+peopleColors[i]+'"><div class="check '+(done?'on':'')+'">'+(done?'✓':rejected?'×':'')+'</div><div><div class="task-name">'+esc(t.title)+'</div>'+(t.description?'<div class="desc">'+esc(t.description)+'</div>':'')+'<div class="meta"><span class="badge">'+esc(t.difficulty||'medium')+'</span><span class="badge">'+esc(t.reward_points||30)+' pts</span><span class="badge">'+esc(t.category||'General')+'</span><span class="badge">From: '+esc(asg.name)+'</span><span class="badge">To: '+esc(ass.name)+'</span>'+(t.due_date?'<span class="badge">'+esc(t.due_date)+'</span>':'')+(done?'<span class="badge">Completed</span>':'')+(rejected?'<span class="badge">Rejected</span>':'')+'</div></div>'+(actions||'')+'</article>';
  }

  function dashboard(){
    const mine=data.assigned_to_me||[], assigned=data.assigned_by_me||[], hist=data.history||[], a=data.achievements||{}, points=data.member.points||0;
    const level=Math.max(1,Math.floor(points/250)+1), levelStart=(level-1)*250, levelNext=level*250, levelPct=Math.min(100,Math.round(((points-levelStart)/(levelNext-levelStart))*100));
    const completed=a.completed||0, rejected=a.rejected||0, assignedCount=a.assigned||0;
    return '<div class="hero"><div><p>Welcome back, '+esc(data.member.name)+' · Level '+level+'</p><h2>Turn today into a quest.</h2><p>'+points+' XP · '+completed+' quests completed · '+rejected+' rejected</p><div class="progress"><i style="width:'+levelPct+'%"></i></div><div style="margin-top:7px;font-size:12px;color:#ffffffbb">'+(levelNext-points)+' XP until Level '+(level+1)+'</div></div><button class="btn" data-act="add">＋ New Quest</button></div>'+
      '<div class="grid stats"><div class="card stat"><b>'+points+'</b><span>My points</span></div><div class="card stat"><b>'+mine.length+'</b><span>Assigned to me</span></div><div class="card stat"><b>'+assigned.length+'</b><span>Assigned by me</span></div><div class="card stat"><b>'+assignedCount+'</b><span>Total assigned</span></div></div>'+
      '<div class="section"><div class="section-head"><h2>Quests assigned to me</h2><button class="btn" data-nav="tasks">View all</button></div><div class="tasks">'+(mine.length?mine.map(t=>taskCard(t,'<div class="task-actions"><button class="btn primary" data-act="complete" data-id="'+t.id+'">✓ Done</button><button class="btn danger" data-act="reject" data-id="'+t.id+'">Reject</button></div>')).join(''):'<div class="empty">No quests are currently assigned to you.</div>')+'</div></div>'+
      '<div class="section"><div class="section-head"><h2>Quests I assigned</h2></div><div class="tasks">'+(assigned.length?assigned.map(t=>taskCard(t,'<div class="task-actions"><button class="icon" data-act="delete" data-id="'+t.id+'">×</button></div>')).join(''):'<div class="empty">You have not assigned any pending tasks.</div>')+'</div></div>'+
      '<div class="section"><div class="section-head"><h2>🏆 Level progress</h2></div><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><b>Level '+level+'</b><div class="desc">Keep completing quests to unlock higher levels and bigger rewards.</div></div><strong style="font-size:24px">'+points+' XP</strong></div><div class="progress" style="background:var(--soft);margin-top:14px"><i style="width:'+levelPct+'%;background:var(--brand)"></i></div></div></div><div class="section"><div class="section-head"><h2>Rewards</h2><button class="btn" data-nav="rewards">Open reward store</button></div><div class="card"><b>Spend your points on real-life rewards.</b><div class="desc">Choose movie night, extra gaming time, dessert, dinner, outings and more.</div></div></div>'+
      '<div class="section"><div class="section-head"><h2>My achievements</h2></div><div class="grid stats"><div class="card stat"><b>'+completed+'</b><span>Quests completed</span></div><div class="card stat"><b>'+rejected+'</b><span>Tasks rejected</span></div><div class="card stat"><b>'+a.finished_points+'</b><span>Points earned from work</span></div><div class="card stat"><b>'+hist.length+'</b><span>History items</span></div></div></div>';
  }

  function tasks(){
    let mine=data.assigned_to_me||[], assigned=data.assigned_by_me||[];
    if(filter.q){const q=filter.q.toLowerCase();mine=mine.filter(t=>t.title.toLowerCase().includes(q));assigned=assigned.filter(t=>t.title.toLowerCase().includes(q))}
    return '<div class="filters"><input class="input" id="search" placeholder="Search your tasks..." value="'+esc(filter.q)+'"><select class="select" id="tasktab"><option value="mine">Assigned to me</option><option value="assigned">Assigned by me</option></select></div><div id="tasklist"></div>';
  }
  function family(){
    return '<div class="grid members">'+members.map((m,i)=>'<div class="member" style="--c:'+peopleColors[i%peopleColors.length]+'"><div class="member-head">'+avatar(m.name,i)+'<div><h3>'+esc(m.name)+'</h3><small>'+(m.id===current.id?'Current player':'Player')+'</small></div></div><div class="member-nums"><span><b>'+(m.id===current.id?data.member.points:'—')+'</b><small>points</small></span><span><b>'+(m.id===current.id?(data.achievements?.completed||0):'—')+'</b><small>completed</small></span></div></div>').join('')+'</div>';
  }
  function rewards(){
    const rs=data.rewards||[], mine=data.my_redemptions||[], pending=data.pending_redemptions||[], pts=data.member.points||0;
    const weekly=data.achievements?.weekly_completed||0, streak=data.achievements?.streak||0;
    return '<div class="card" style="margin-bottom:14px"><div class="section-head"><div><h2 style="margin:0">🎁 Loot Store</h2><div class="desc">Spend XP on real-life rewards, privileges and activities.</div></div>'+(data.member.is_admin?'<button class="btn primary" data-act="add-reward">＋ Add reward</button>':'')+'</div><div class="meta"><span class="badge">'+pts+' XP available</span><span class="badge">🔥 '+streak+' day streak</span><span class="badge">🎯 '+weekly+'/5 tasks this week</span></div></div>'+
      '<div class="grid members">'+(rs.length?rs.map(r=>'<div class="member"><div class="member-head"><div class="avatar" style="--c:var(--brand)">🎁</div><div><h3>'+esc(r.name)+'</h3><small>'+esc(r.category)+'</small></div></div><p class="desc">'+esc(r.description)+'</p><div class="reward"><div class="points">'+r.cost+' pts</div><button class="btn primary" data-act="redeem" data-id="'+r.id+'" '+(pts<r.cost?'disabled':'')+'>'+(pts<r.cost?'Need '+(r.cost-pts)+' more':'Redeem')+'</button></div></div>').join(''):'<div class="empty">No rewards available.</div>')+'</div>'+
      '<div class="section"><div class="section-head"><h2>Weekly challenge</h2>'+(weekly>=5?'<button class="btn primary" data-act="claim-weekly">Claim +30 pts</button>':'')+'</div><div class="card"><b>Complete 5 tasks this week</b><div class="desc">'+weekly+'/5 completed. Earn a 30 point bonus once per week.</div></div></div>'+
      (data.member.is_admin&&pending.length?'<div class="section"><div class="section-head"><h2>Reward approvals</h2></div><div class="tasks">'+pending.map(x=>'<article class="task"><div class="check">🎁</div><div><div class="task-name">'+esc(x.member_name)+' wants '+esc(x.reward_name)+'</div><div class="meta"><span class="badge">'+x.cost+' pts</span><span class="badge">Pending</span></div></div><div class="task-actions"><button class="btn primary" data-act="approve-reward" data-id="'+x.id+'">Approve</button><button class="btn danger" data-act="decline-reward" data-id="'+x.id+'">Decline</button></div></article>').join('')+'</div></div>':'')+
      '<div class="section"><div class="section-head"><h2>My reward history</h2></div><div class="card feed">'+(mine.length?mine.map(x=>'<div class="feed-item"><div class="points">'+x.cost+'</div><div><b>'+esc(x.reward_name)+'</b><div class="desc">'+esc(x.status)+' · '+fmtDate(x.created_at)+'</div></div></div>').join(''):'<div class="empty">You have not redeemed any rewards yet.</div>')+'</div></div>';
  }
  function stats(){
    const a=data.achievements||{},tx=data.transactions||[];
    return '<div class="grid stats"><div class="card stat"><b>'+data.member.points+'</b><span>Current points</span></div><div class="card stat"><b>'+(a.completed||0)+'</b><span>Completed</span></div><div class="card stat"><b>'+(a.rejected||0)+'</b><span>Rejected</span></div><div class="card stat"><b>'+(a.finished_points||0)+'</b><span>Earned from tasks</span></div></div><div class="section"><div class="section-head"><h2>Points history</h2></div><div class="card feed">'+(tx.length?tx.map(x=>'<div class="feed-item"><div class="points">'+(x.to_name===current.name?'+':'−')+x.amount+'</div><div><b>'+esc(({'task_completed':'Task completed','task_rejected':'Task rejected','reward_redeemed':'Reward reserved','reward_refund':'Reward refunded','weekly_challenge':'Weekly bonus'}[x.reason]||'Points update'))+'</b><div class="desc">'+esc(x.from_name||'')+' → '+esc(x.to_name||'')+' · '+fmtDate(x.created_at)+'</div></div></div>').join(''):'<div class="empty">No points transactions yet.</div>')+'</div></div>';
  }
  function settings(){return '<div class="grid"><div class="card"><h2>Account</h2><p class="desc">Signed in as <b>'+esc(current.name)+'</b>.</p><button class="btn danger" data-act="logout">Log out</button></div><div class="card"><h2>Security</h2><p class="desc">Your PIN is stored as a secure hash in the backend. It is never displayed here.</p></div><div class="card"><h2>Player profiles</h2><p class="desc">Occupation/profession descriptions remain removed.</p></div></div>'}

  function shell(body){
    const ci=Math.max(0,members.findIndex(m=>m.id===current.id));
    return '<div class="layout"><aside class="side"><div class="logo"><i>✓</i>LifeQuest</div><div class="nav">'+nav.map(n=>'<button class="'+(view===n[0]?'active':'')+'" data-nav="'+n[0]+'">'+n[1]+' &nbsp; '+n[2]+'</button>').join('')+'</div><div class="side-bottom"><button class="btn primary" style="width:100%" data-act="add">＋ Create quest</button></div></aside><main class="main"><header class="top"><div class="title"><h1>'+(nav.find(n=>n[0]===view)||nav[0])[2]+'</h1><p>'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</p></div><div class="actions"><div class="current-member">'+avatar(current.name,ci)+'<span>'+esc(current.name)+'</span><button class="profile-switch" data-act="switch-member">Switch</button></div><button class="btn" data-act="theme">☾</button><button class="btn primary" data-act="add">＋ Assign task</button></div></header>'+body+'</main></div><nav class="mobile-nav">'+nav.map(n=>'<button class="'+(view===n[0]?'active':'')+'" data-nav="'+n[0]+'">'+n[1]+'<br>'+n[2]+'</button>').join('')+'</nav>';
  }

  function render(){
    if(!members.length){document.getElementById('app').innerHTML='<main class="profile-screen"><section class="profile-box"><h1>Loading LifeQuest…</h1></section></main>';return}
    if(!getToken()){document.getElementById('app').innerHTML=current&&current._pinScreen?pinScreen(current):profileScreen();return}
    document.documentElement.dataset.theme=localStorage.getItem('lifequest-theme')==='dark'?'dark':'light';
    let body=view==='dashboard'?dashboard():view==='tasks'?tasks():view==='rewards'?rewards():view==='family'?family():view==='stats'?stats():settings();
    document.getElementById('app').innerHTML=shell(body);
    if(view==='tasks')renderTaskList();
  }
  function renderTaskList(){
    const el=document.getElementById('tasklist'),tab=document.getElementById('tasktab');if(!el)return;
    let arr=tab&&tab.value==='assigned'?(data.assigned_by_me||[]):(data.assigned_to_me||[]);
    if(filter.q){const q=filter.q.toLowerCase();arr=arr.filter(t=>(t.title||'').toLowerCase().includes(q))}
    el.innerHTML='<div class="tasks">'+(arr.length?arr.map(t=>taskCard(t,tab&&tab.value==='mine'?'<div class="task-actions"><button class="btn primary" data-act="complete" data-id="'+t.id+'">✓ Done</button><button class="btn danger" data-act="reject" data-id="'+t.id+'">Reject</button></div>':'')).join(''):'<div class="empty">No matching tasks.</div>')+'</div>';
  }

  function modal(){
    const opts=members.filter(m=>m.id!==current.id).map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('');
    document.getElementById('modal').innerHTML='<form id="taskform"><div class="modal-head"><h2>Create a quest</h2><button type="button" class="icon" data-act="close">×</button></div><div class="fields"><div><label class="label">Quest title</label><input class="input" name="title" required></div><div><label class="label">Description</label><textarea class="textarea" name="description"></textarea></div><div class="row"><div><label class="label">Assign to</label><select class="select" name="assignee" required>'+opts+'</select></div><div><label class="label">Quest difficulty</label><select class="select" name="difficulty"><option value="small">Small — 10 points</option><option value="medium" selected>Medium — 30 points</option><option value="high">High — 50 points</option></select></div></div><div class="row"><div><label class="label">Due date</label><input class="input" type="date" name="due" value="'+today()+'"></div><div><label class="label">Category</label><select class="select" name="category"><option>Chores</option><option>School</option><option>Study</option><option>Home</option><option>Shopping</option><option>Other</option></select></div></div><div><label class="label">Priority</label><select class="select" name="priority"><option>high</option><option selected>medium</option><option>low</option></select></div><div class="card"><b>Point rule</b><div class="desc">Small tasks are worth 10 points, medium 30, and high 50. Rewards start at 120 points so members need to build up their balance before redeeming. Completing transfers the task value from the person who assigned it to the person who completes it.</div></div></div><div class="modal-foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Assign task</button></div></form>';
    document.getElementById('modal').hidden=false;
  }
  function rewardModal(){
    document.getElementById('modal').innerHTML='<form id="rewardform"><div class="modal-head"><h2>Create a reward</h2><button type="button" class="icon" data-act="close">×</button></div><div class="fields"><div><label class="label">Reward name</label><input class="input" name="name" placeholder="e.g. Pizza night" required></div><div><label class="label">Description</label><textarea class="textarea" name="description" placeholder="What does the member get?"></textarea></div><div class="row"><div><label class="label">Point cost</label><input class="input" type="number" name="cost" min="120" step="10" required></div><div><label class="label">Category</label><select class="select" name="category"><option>Fun</option><option>Food</option><option>Gaming</option><option>Privileges</option><option>Outings</option><option>Special</option></select></div></div></div><div class="modal-foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Create reward</button></div></form>';
    document.getElementById('modal').hidden=false;
  }

  document.addEventListener('click',async e=>{
    const pc=e.target.closest('[data-member]');
    if(pc){current=members.find(m=>m.id===pc.dataset.member);current._pinScreen=true;render();return}
    const navb=e.target.closest('[data-nav]');if(navb){go(navb.dataset.nav);return}
    const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act,id=b.dataset.id;
    try{
      if(a==='back-members'){current=null;render()}
      else if(a==='close'){document.getElementById('modal').hidden=true}
      else if(a==='add'){modal()}
      else if(a==='add-reward'){rewardModal()}
      else if(a==='redeem'){if(!confirm('Reserve this reward? The points will be deducted now and returned if an admin declines the request.'))return;await rpc('ff_redeem_reward',{p_token:getToken(),p_reward_id:id});await loadDashboard();render();showToast('Reward reserved — waiting for approval.')}
      else if(a==='approve-reward'){if(!confirm('Approve this reward redemption?'))return;await rpc('ff_decide_redemption',{p_token:getToken(),p_redemption_id:id,p_approve:true});await loadDashboard();render();showToast('Reward approved.')}
      else if(a==='decline-reward'){if(!confirm('Decline this reward? The points will be returned.'))return;await rpc('ff_decide_redemption',{p_token:getToken(),p_redemption_id:id,p_approve:false});await loadDashboard();render();showToast('Reward declined and points returned.')}
      else if(a==='claim-weekly'){await rpc('ff_claim_weekly_bonus',{p_token:getToken()});await loadDashboard();render();showToast('Weekly bonus claimed — 30 points added.')}
      else if(a==='switch-member'){setToken(null);current=null;data=null;render()}
      else if(a==='logout'){await rpc('ff_logout',{p_token:getToken()});setToken(null);current=null;data=null;render()}
      else if(a==='theme'){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('lifequest-theme',d);render()}
      else if(a==='complete'){if(!confirm('Complete this quest? The task points will move from the person who assigned it to you.'))return;await rpc('ff_complete_task',{p_token:getToken(),p_task_id:id});await loadDashboard();render();showToast('Task completed — points added to you.')}
      else if(a==='reject'){if(!confirm('Reject this task? You will give 10 points to the person who assigned it.'))return;await rpc('ff_reject_task',{p_token:getToken(),p_task_id:id});await loadDashboard();render();showToast('Task rejected — points transferred.')}
      else if(a==='delete'){if(!confirm('Delete this pending quest?'))return;await rpc('ff_delete_task',{p_token:getToken(),p_task_id:id});await loadDashboard();render();showToast('Task deleted.')}
    }catch(err){showToast(err.message)}
  });

  document.addEventListener('submit',async e=>{
    if(e.target.id==='pinform'){
      e.preventDefault();const pin=String(new FormData(e.target).get('pin')).trim();
      try{const r=current._pinScreen&&current.initialized?await rpc('ff_login_member',{p_member_id:current.id,p_pin:pin}):current._pinScreen?await rpc('ff_register_member',{p_member_id:current.id,p_pin:pin}):null;setToken(r.token);current=r.member;delete current._pinScreen;await loadDashboard();render();showToast(r.member.points===50?'Welcome — 50 starting points added.':'Welcome back!')}catch(err){showToast(err.message)}
    }
    if(e.target.id==='rewardform'){
      e.preventDefault();const f=new FormData(e.target);
      try{await rpc('ff_create_reward',{p_token:getToken(),p_name:String(f.get('name')).trim(),p_description:String(f.get('description')||''),p_cost:Number(f.get('cost')),p_category:String(f.get('category'))});document.getElementById('modal').hidden=true;await loadDashboard();render();showToast('Reward created.')}catch(err){showToast(err.message)}
    }
    if(e.target.id==='taskform'){
      e.preventDefault();const f=new FormData(e.target);
      try{await rpc('ff_create_task',{p_token:getToken(),p_title:String(f.get('title')).trim(),p_description:String(f.get('description')||''),p_assignee_id:String(f.get('assignee')),p_due_date:String(f.get('due')||'')||null,p_priority:String(f.get('priority')),p_category:String(f.get('category')),p_difficulty:String(f.get('difficulty'))});document.getElementById('modal').hidden=true;await loadDashboard();render();showToast('Task assigned.')}catch(err){showToast(err.message)}
    }
  });

  document.addEventListener('input',e=>{if(e.target.id==='search'){filter.q=e.target.value;renderTaskList()}})
  document.addEventListener('change',e=>{if(e.target.id==='tasktab')renderTaskList()});
  window.addEventListener('hashchange',()=>{view=location.hash.slice(2)||'dashboard';render()});

  (async()=>{
    try{
      await loadMembers();
      const token=getToken();
      if(token){try{await loadDashboard()}catch(e){setToken(null);data=null;current=null}}
      render();
    }catch(e){document.getElementById('app').innerHTML='<main class="profile-screen"><section class="profile-box"><h1>LifeQuest could not connect</h1><p class="desc">'+esc(e.message)+'</p><button class="btn primary" onclick="location.reload()">Try again</button></section></main>'}
  })();
})();
</script>
</body>
</html>
