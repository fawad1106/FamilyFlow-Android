<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="app">
        <header class="topbar">
            <div><p class="eyebrow">PERSONAL COMMAND CENTER</p><h1>LifeOS</h1></div>
            <button id="theme-button" type="button">Toggle theme</button>
        </header>
        <section class="hero">
            <p class="eyebrow">TODAY</p>
            <h2>What matters right now?</h2>
            <p class="muted">Your tasks, projects, notes, and deadlines will eventually live here.</p>
        </section>
        <section class="grid">
            <article class="card"><div class="card-heading"><h3>Tasks</h3><span>0</span></div><p class="muted">No tasks yet.</p><button id="add-task" type="button">Add task</button></article>
            <article class="card"><div class="card-heading"><h3>Projects</h3><span>0</span></div><p class="muted">Your projects will appear here.</p><button id="add-project" type="button">Add project</button></article>
            <article class="card"><div class="card-heading"><h3>Notes</h3><span>0</span></div><p class="muted">Your knowledge starts here.</p><button id="add-note" type="button">Add note</button></article>
        </section>
        <section class="activity card"><h3>Activity</h3><p id="activity-message" class="muted">LifeOS is ready for its first feature.</p></section>
    </main>
    <script src="/js/main.js"></script>
</body>
</html>
